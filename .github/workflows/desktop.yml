name: Desktop

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
  # Reusable: invoked by release.yml for v* tags (signed NSIS/DEB + updater sigs).
  # The experimental macOS client builds separately in desktop-macos.yml.
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      source-sha:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read
  packages: write

env:
  # Updater public key is compiled into the app via env! in the Rust build
  # script (native lane). Public material → repository variable, not secret.
  E_LAUNCHER_UPDATER_PUBLIC_KEY: ${{ vars.E_LAUNCHER_UPDATER_PUBLIC_KEY }}

jobs:
  test:
    name: Desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host-core/package-lock.json
            center-server/package-lock.json

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/host-launcher -> target
          cache-on-failure: true

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix host-core
          npm ci --prefix center-server

      # Shared Host, center and release behaviour, including the updater
      # signature check and center publish/query/download of a bundle signed
      # with a throwaway Tauri key (web/test/macos-client-release.test.mjs).
      - name: Node tests
        run: npm test

      - name: Launcher tests
        working-directory: desktop/host-launcher
        run: cargo test --locked

  build:
    name: Desktop ${{ matrix.bundle }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundle: nsis
            artifact: desktop-windows
          - os: ubuntu-24.04
            bundle: deb
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host-core/package-lock.json

      # rust-toolchain.toml pins channel 1.99.1 (profile minimal).
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> ../build/target
            desktop/host-launcher -> target
          cache-on-failure: true

      - name: Cache pinned desktop runtime archives
        uses: actions/cache@v6
        with:
          path: |
            desktop/build/cache/downloads
            desktop/build/cache/search-tools/archives
          key: desktop-archives-${{ runner.os }}-${{ hashFiles('host-core/build-desktop.js', 'host-core/cua-driver-release.json', 'host-core/search-bin.js') }}
          restore-keys: |
            desktop-archives-${{ runner.os }}-

      - name: Install Linux webkit dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev pkg-config

      - name: Install web dependencies
        run: npm ci

      - name: Install Host dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix host-core

      - name: Verify product version consistency
        shell: bash
        env:
          TAG_ARG: ${{ inputs.release && format('--tag v{0}', inputs.version) || '' }}
        run: node scripts/release-check.mjs $TAG_ARG

      - name: Build installer
        shell: bash
        env:
          RELEASE: ${{ inputs.release || false }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RELEASE" = true ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater private key"; exit 1; }
            test -n "$E_LAUNCHER_UPDATER_PUBLIC_KEY" || { echo "Missing updater public key"; exit 1; }
            config=$(node -p 'JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.E_LAUNCHER_UPDATER_PUBLIC_KEY.trim()}}})')
            extra=(--config "$config")
          fi
          npm run desktop:build -- --bundles ${{ matrix.bundle }} "${extra[@]}"

      # Desktop crate unit tests, including the macOS update rule that the
      # bundle is only replaced after a confirmed Host stop (the logic is
      # platform independent). The crate compiles only once the build above
      # has prepared its bundled binaries and resources.
      - name: Desktop crate tests
        if: runner.os == 'Linux'
        working-directory: desktop
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version || github.sha }}
          path: desktop/build/target/release/bundle/
          if-no-files-found: error
          retention-days: 30
