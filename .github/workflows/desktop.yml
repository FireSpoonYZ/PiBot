name: Desktop

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
  # Reusable: invoked by release.yml for v* tags (signed NSIS/DEB + updater sigs).
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.release || false }}
  cancel-in-progress: ${{ !inputs.release }}

permissions:
  contents: read
  packages: write

env:
  # Updater public key is compiled into the app via env! in the Rust build
  # script (native lane). Public material → repository variable, not secret.
  E_LAUNCHER_UPDATER_PUBLIC_KEY: ${{ vars.E_LAUNCHER_UPDATER_PUBLIC_KEY }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundle: nsis
            artifact: desktop-windows
          - os: ubuntu-24.04
            bundle: deb
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # rust-toolchain.toml pins channel 1.99.1 (profile minimal).
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          rustc --version
          cargo --version

      - name: Install Linux webkit dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev pkg-config

      - name: Install web dependencies
        run: npm ci

      - name: Prepare pinned Pi and Host dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:pi-main
          npm ci --prefix host-core

      - name: Verify product version consistency
        shell: bash
        env:
          TAG_ARG: ${{ inputs.release && format('--tag v{0}', inputs.version) || '' }}
        run: node scripts/release-check.mjs $TAG_ARG

      - name: Build installer
        shell: bash
        env:
          RELEASE: ${{ inputs.release || false }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RELEASE" = true ]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater private key"; exit 1; }
            test -n "$E_LAUNCHER_UPDATER_PUBLIC_KEY" || { echo "Missing updater public key"; exit 1; }
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npm run desktop:build -- --bundles ${{ matrix.bundle }} "${extra[@]}"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version || github.sha }}
          path: desktop/build/target/release/bundle/
          if-no-files-found: error
          retention-days: 30
