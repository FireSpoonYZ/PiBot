name: APK

on:
  push:
    branches: ['**']
  workflow_dispatch:
  # Reusable: invoked by release.yml for v* tags (signed release APK).
  workflow_call:
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64:
        required: true
      ANDROID_RELEASE_STORE_PASSWORD:
        required: true
      ANDROID_RELEASE_KEY_ALIAS:
        required: true
      ANDROID_RELEASE_KEY_PASSWORD:
        required: true

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host-core/package-lock.json
            center-server/package-lock.json

      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
            ${{ env.ANDROID_HOME }}/platforms/android-36
          key: android-36-ndk-28.2.13676358-cmake-3.22.1

      - name: Install Android packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.22.1"

      # rust-toolchain.toml pins channel 1.99.1; add the two Android targets.
      - name: Install Rust toolchain and Android targets
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup not found on this runner image" >&2
            exit 1
          fi
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version

      - name: Install web dependencies
        run: npm ci

      - name: Prepare Pi runtime packages
        run: npm run prepare:pi-main

      - name: Install host and center dependencies
        run: |
          npm --prefix host-core ci
          npm --prefix center-server ci

      - name: Test web
        run: npm test

      - name: Prepare Node Mobile
        shell: pwsh
        run: ./scripts/prepare-node-mobile.ps1

      - name: Verify product version consistency
        env:
          TAG_ARG: ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}
        run: node scripts/release-check.mjs $TAG_ARG

      # Branch pushes: debug APK artifact only — no signing secrets required.
      - name: Assemble debug APK
        if: github.ref_type != 'tag'
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :shower-server:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # v* tags: signed release APK, uploaded for the shared release job.
      # Release signing resolves lazily in app/build.gradle afterEvaluate; the
      # ANDROID_RELEASE_* env vars below are only read when release tasks run.
      - name: Decode release keystore
        if: github.ref_type == 'tag'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: github.ref_type == 'tag'
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :shower-server:lintDebug :app:assembleRelease
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

      - name: Verify APK signature and publish artifact
        if: github.ref_type == 'tag'
        env:
          EXPECTED_ANDROID_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt"
          EXPECTED="${EXPECTED_ANDROID_CERT_SHA256,,}"
          EXPECTED="${EXPECTED//:/}"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "Configure ANDROID_RELEASE_CERT_SHA256 before official release"; exit 1; }
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | tail -n 1 | tr 'A-F' 'a-f')
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "APK signing identity does not match"; exit 1; }
          mkdir -p release-out
          cp "$APK" release-out/e-launcher-android-arm64.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release APK
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ github.ref_name }}
          path: release-out/e-launcher-android-arm64.apk
          if-no-files-found: error
          retention-days: 30
