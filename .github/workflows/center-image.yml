name: Center image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: center-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the push event on main publishes; pull_request and
      # workflow_dispatch (even when dispatched on main) are build-only.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/firespoonyz/e-launcher-center:latest
            ghcr.io/firespoonyz/e-launcher-center:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
