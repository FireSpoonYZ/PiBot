name: Release
run-name: ${{ inputs.candidate && format('Candidate PiBot {0}', inputs.tag) || format('Release PiBot {0}', inputs.tag || github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z); candidate builds use the selected master commit
        required: true
        type: string
      candidate:
        description: Build signed candidate artifacts without publishing a release
        type: boolean
        default: false

concurrency:
  group: official-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      candidate_run: ${{ steps.version.outputs.candidate_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          CANDIDATE: ${{ inputs.candidate || false }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a release tag"; exit 1; }
          if [ "$CANDIDATE" = true ]; then
            SOURCE_REF="$GITHUB_SHA"
          else
            SOURCE_REF="refs/tags/$REQUESTED_TAG"
          fi
          git checkout --detach "$SOURCE_REF"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          VERSION="${REQUESTED_TAG#v}"
          node scripts/release-check.mjs --tag "$REQUESTED_TAG"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/master
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version already released; published versions are immutable."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          CANDIDATE_RUN=""
          if [ "$CANDIDATE" != true ] && [ "$(git cat-file -t "$SOURCE_REF")" = tag ]; then
            CANDIDATE_RUN=$(git for-each-ref --format='%(contents)' "$SOURCE_REF" | sed -n 's/^Candidate-Run: //p')
          fi
          if [ -n "$CANDIDATE_RUN" ]; then
            [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid candidate run"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-run.json"
            jq -e --arg sha "$SOURCE_COMMIT" --arg title "Candidate PiBot $REQUESTED_TAG" --arg repo "$GITHUB_REPOSITORY" \
              '.head_sha == $sha and .head_repository.full_name == $repo and .event == "workflow_dispatch" and .conclusion == "success" and .path == ".github/workflows/release.yml" and .display_title == $title' \
              "$RUNNER_TEMP/candidate-run.json" >/dev/null
          fi
          echo "candidate_run=$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: ${{ needs.version.outputs.candidate_run == '' }}
    uses: ./.github/workflows/apk.yml
    with:
      release: true
      version: ${{ needs.version.outputs.version }}
      source-ref: ${{ needs.version.outputs.source_ref }}
      source-sha: ${{ needs.version.outputs.sha }}
    secrets: inherit

  desktop:
    needs: version
    if: ${{ needs.version.outputs.candidate_run == '' }}
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
      version: ${{ needs.version.outputs.version }}
      source-ref: ${{ needs.version.outputs.source_ref }}
      source-sha: ${{ needs.version.outputs.sha }}
    secrets: inherit

  center:
    needs: version
    if: ${{ needs.version.outputs.candidate_run == '' }}
    uses: ./.github/workflows/center.yml
    with:
      release: true
      version: ${{ needs.version.outputs.version }}
      source-ref: ${{ needs.version.outputs.source_ref }}
      source-sha: ${{ needs.version.outputs.sha }}
    secrets: inherit

  publish:
    needs: [version, android, desktop, center]
    if: ${{ always() && !cancelled() && needs.version.result == 'success' && (needs.version.outputs.candidate_run != '' || (needs.android.result == 'success' && needs.desktop.result == 'success' && needs.center.result == 'success')) }}
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ needs.version.outputs.version }}'
          path: artifacts
          merge-multiple: true
          run-id: ${{ needs.version.outputs.candidate_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-out
          copy_installer() {
            local pattern="$1" name="$2" signed="$3"
            mapfile -d '' files < <(find artifacts -type f -name "$pattern" -print0)
            [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one $pattern installer"; exit 1; }
            cp "${files[0]}" "release-out/$name"
            if [ "$signed" = yes ]; then cp "${files[0]}.sig" "release-out/$name.sig"; fi
          }
          copy_installer "*.exe" "PiBot-$VERSION-windows-x64-setup.exe" yes
          copy_installer "e-launcher-desktop_*.deb" "PiBot-$VERSION-linux-amd64.deb" yes
          copy_installer "*.apk" "PiBot-$VERSION-android-arm64.apk" no
          copy_installer "pibot-center_${VERSION}_amd64.deb" "PiBot-$VERSION-center-linux-amd64.deb" no
          copy_installer "pibot-center_${VERSION}_arm64.deb" "PiBot-$VERSION-center-linux-arm64.deb" no
          for spec in "amd64 PiBot-$VERSION-center-linux-amd64.deb" "arm64 PiBot-$VERSION-center-linux-arm64.deb"; do
            read -r deb_arch deb_name <<< "$spec"
            fields=$(dpkg-deb --field "release-out/$deb_name")
            grep -qx "Package: pibot-center" <<<"$fields"
            grep -qx "Version: $VERSION" <<<"$fields"
            grep -qx "Architecture: $deb_arch" <<<"$fields"
          done
          for spec in "windows x86_64 nsis windows-x64-setup.exe" "linux x86_64 deb linux-amd64.deb" "android aarch64 apk android-arm64.apk"; do
            read -r platform arch format suffix <<< "$spec"
            extra=()
            if [ "$format" = apk ]; then
              extra=(--version-code "$(sed -n 's/^android.versionCode=//p' gradle.properties | tr -d '\r')")
            fi
            node scripts/release-artifact.mjs --version "$VERSION" --commit "$SOURCE_COMMIT" \
              --notes "PiBot $VERSION" --platform "$platform" --arch "$arch" --format "$format" \
              --file "release-out/PiBot-$VERSION-$suffix" "${extra[@]}" \
              --out "release-out/PiBot-$VERSION-$suffix.metadata.json"
          done
          cp artifacts/center-image.json release-out/
          cp compose.yaml compose.https.yaml Caddyfile center.env.example release-out/
          sed -i "s/pibot-center:latest/pibot-center:$VERSION/" release-out/compose.yaml
          git archive --format=tar.gz --prefix="PiBot-$VERSION/" -o "release-out/PiBot-$VERSION-source.tar.gz" "$SOURCE_COMMIT"
          git archive --format=zip --prefix="PiBot-$VERSION/" -o "release-out/PiBot-$VERSION-source.zip" "$SOURCE_COMMIT"
          (cd release-out; sha256sum -- * > SHA256SUMS)
      - name: Upload candidate release assets
        if: inputs.candidate
        uses: actions/upload-artifact@v7
        with:
          name: candidate-assets-${{ needs.version.outputs.sha }}
          path: release-out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish matching image tags and GitHub Release
        if: ${{ !inputs.candidate }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pibot-center"
          DIGEST=$(node -p "JSON.parse(require('fs').readFileSync('release-out/center-image.json')).digest")
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          cat > release-notes.md <<EOF
          ## PiBot $VERSION
          - Windows：下载 windows-x64-setup.exe
          - Ubuntu / Debian（桌面客户端）：下载 linux-amd64.deb
          - Android：下载 android-arm64.apk（Android 13+）
          - 中心（Docker）：\`$IMAGE:$VERSION\`（amd64 / arm64）
          - 中心（Ubuntu / Debian DEB）：下载 center-linux-amd64.deb 或 center-linux-arm64.deb
          - 源码包：下载 PiBot-$VERSION-source.tar.gz 或 PiBot-$VERSION-source.zip

          Docker 部署下载 compose.yaml、compose.https.yaml、Caddyfile 和 center.env.example；DEB 直装执行 \`sudo apt install ./PiBot-$VERSION-center-linux-amd64.deb\`，
          按 [快速开始](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/README.md) 部署。
          Pi SDK：1.5.0。桌面与中心 Node：26.13.0 LTS。
          Android 使用上游最新可下载 Node Mobile 24.18.0-0，尚未跟进 2026 年 10 月 Node 安全更新。
          Android 首发采用独立正式签名；旧开发签名安装请先导出需要的数据。
          Windows 当前使用登录自启动任务，尚未提供无人登录的 SCM 服务。

          Source: $SOURCE_COMMIT
          EOF
          gh release create "v$VERSION" release-out/* --target "$SOURCE_COMMIT" \
            --title "PiBot v$VERSION" --notes-file release-notes.md --generate-notes --verify-tag --latest
