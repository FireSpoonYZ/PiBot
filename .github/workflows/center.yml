name: Center image

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      source-sha:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Center image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pibot-center" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: inputs.release
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.release || false }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ inputs.source-sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image metadata
        if: inputs.release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source-sha || github.sha }}
        run: |
          printf '{"version":"%s","platform":"center","image":"%s:%s","digest":"%s","sourceCommit":"%s"}\n' \
            "$VERSION" "$IMAGE" "$VERSION" "$DIGEST" "$SOURCE_COMMIT" > center-image.json
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: center-image-${{ inputs.version }}
          path: center-image.json
          if-no-files-found: error

  deb:
    name: Center deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: |
            center-web/package-lock.json
            center-server/package-lock.json
            host-core/package-lock.json
      - name: Cache pinned Center DEB Node archives
        uses: actions/cache@v6
        with:
          path: build/center-deb-cache/*.tar.gz
          key: center-deb-node-${{ runner.os }}-${{ hashFiles('scripts/build-center-deb.mjs') }}
          restore-keys: |
            center-deb-node-${{ runner.os }}-
      - name: Verify product version consistency
        shell: bash
        env:
          TAG_ARG: ${{ inputs.release && format('--tag v{0}', inputs.version) || '' }}
        run: node scripts/release-check.mjs $TAG_ARG
      - name: Build and smoke-test Center DEB packages
        shell: bash
        env:
          VERSION_ARG: ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
        run: node scripts/build-center-deb.mjs $VERSION_ARG --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: center-deb-${{ inputs.version || github.sha }}
          path: build/center-deb/*.deb
          if-no-files-found: error
          retention-days: 30
