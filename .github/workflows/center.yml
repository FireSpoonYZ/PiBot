name: Center image

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: center-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/e-launcher-center

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          TAGS="${IMAGE}:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="$TAGS,${IMAGE}:${GITHUB_REF_NAME#v}"
          else
            TAGS="$TAGS,${IMAGE}:sha-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit image metadata
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          cat > center-image.json <<EOF
          {
            "version": "$VERSION",
            "platform": "center",
            "image": "${IMAGE}:${GITHUB_REF_NAME}",
            "digest": "${{ steps.build.outputs.digest }}",
            "sourceCommit": "$GITHUB_SHA"
          }
          EOF
          cat center-image.json

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: center-image-metadata
          path: center-image.json
          if-no-files-found: error
          retention-days: 30
