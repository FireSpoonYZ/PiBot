name: Center image

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pibot-center" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: inputs.release
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.release || false }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image metadata
        if: inputs.release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '{"version":"%s","platform":"center","image":"%s:%s","digest":"%s","sourceCommit":"%s"}\n' \
            "$VERSION" "$IMAGE" "$VERSION" "$DIGEST" "$GITHUB_SHA" > center-image.json
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: center-image-${{ inputs.version }}
          path: center-image.json
          if-no-files-found: error
