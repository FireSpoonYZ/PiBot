name: Center client preview
run-name: Center clients 0.0.27-dev.4

on:
  push:
    branches:
      - codex/center-preview-0.0.27-dev.4

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/desktop.yml
    with:
      source-ref: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      source-sha: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      release: true
      version: 0.0.27-dev.4
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  android:
    uses: ./.github/workflows/apk.yml
    with:
      source-ref: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      source-sha: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      release: true
      version: 0.0.27-dev.4
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

  macos:
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-ref: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      source-sha: fb74f16fcfd64067807f0d6a738c5fa2a686352c
      release: true
      version: 0.0.27-dev.4
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
