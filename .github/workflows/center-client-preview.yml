name: Center client preview
run-name: Center clients 0.0.27-dev.8

on:
  push:
    branches:
      - codex/center-preview-0.0.27-dev.8

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/desktop.yml
    with:
      source-ref: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      source-sha: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      release: true
      version: 0.0.27-dev.8
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  android:
    uses: ./.github/workflows/apk.yml
    with:
      source-ref: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      source-sha: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      release: true
      version: 0.0.27-dev.8
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

  macos:
    uses: ./.github/workflows/desktop-macos.yml
    with:
      source-ref: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      source-sha: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      release: true
      version: 0.0.27-dev.8
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  center:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/center.yml
    with:
      source-ref: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      source-sha: d5c2d046ef28c0123eb111885317839aa6bd2fd6
      release: true
      version: 0.0.27-dev.8
