# 中心 HTTP/API/SSE 与 /v1/link 共用内部 8080；HTTPS/WSS 由反向代理提供。
# 默认只向宿主机回环发布。容器反代可走 center:8080 并移除 ports。
# 对外地址与首次初始化见 center.env.example、docs/center-linux-deployment.md。

services:
  center:
    # v* Tag 的全部正式构建成功后发布版本镜像和 latest。
    image: ghcr.io/firespoonyz/pibot-center:latest
    # 源码构建（开发）：把上面的 image 换成下面三行，再 docker compose up -d --build
    # image: pibot-center:local
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    restart: unless-stopped
    # 首次使用前：cp center.env.example center.env 并填写对外地址。
    env_file:
      - center.env
    environment:
      CENTER_DATA_ROOT: /data
      CENTER_LISTEN_HOST: 0.0.0.0
      CENTER_PORT: "8080"
      CENTER_WEB_ROOT: /app/center-web/dist
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - center-data:/data
      # 可选：启用 Antigravity (agy) ACP Provider 时，可将宿主机已验证的官方 agy 二进制以只读方式挂载进容器；
      # 专用 profile 与会话默认持久化在 /data/antigravity（由 center-data 卷保存），不得指向日常 ~/.gemini。
      # 登录需以容器服务用户 node 执行，详见 docs/antigravity-center.md：
      # - /usr/local/bin/agy:/usr/local/bin/agy:ro

volumes:
  center-data:
