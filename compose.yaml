services:
  center:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-launcher-center:local
    restart: unless-stopped
    env_file:
      - center.env
    environment:
      CENTER_DATA_ROOT: /data
      CENTER_LISTEN_HOST: 0.0.0.0
      CENTER_PORT: "8080"
      CENTER_WEB_ROOT: /app/center-web/dist
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - center-data:/data

volumes:
  center-data:
