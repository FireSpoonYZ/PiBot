[default]
description = "Default desktop client command permissions."
permissions = ["client"]

[[set]]
identifier = "client"
description = "Allows only the fixed desktop client commands."
permissions = [
  "allow-desktop-request",
  "allow-desktop-open-center",
  "allow-desktop-observe",
  "allow-desktop-unobserve",
  "allow-desktop-pick-file",
  "allow-desktop-host-status",
  "allow-desktop-host-pair",
  "allow-desktop-host-adopt",
  "allow-desktop-host-control",
  "allow-desktop-update-status",
  "allow-desktop-update-check",
  "allow-desktop-update-download",
  "allow-desktop-update-install",
  "allow-desktop-update-cancel",
]
