[package]
name = "pibot"
version = "0.0.27"
edition = "2021"
publish = false

[lib]
name = "e_launcher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
base64 = "0.22"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["unstable"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
clipboard-sync = { path = "../../clipboard-sync" }
clipboard-sync-relay-client = { path = "../../clipboard-sync/relay-client" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }

[target."cfg(windows)".dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
javascriptcore-rs = "=1.1.2"
libc = "0.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
wl-clipboard-rs = "=0.9.5"
x11rb = { version = "0.13", features = ["xfixes"] }
