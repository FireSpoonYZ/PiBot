[package]
name = "clipboard-sync"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Plaintext eligibility and XChaCha20-Poly1305 group encryption for PiBot clipboard sync"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
